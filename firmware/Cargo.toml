[package]
name = "evc04-cn28-prober"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "ESP32 (Xtensa) interactive CN28 LOG remote prober — sends MQTT-driven bytes to CN28, publishes raw responses."
license = "MIT"
repository = "https://github.com/andicoder/evc04"

[[bin]]
name = "evc04-cn28-prober"
path = "src/main.rs"

# Independent crate — NOT a workspace member of the root daemon. Built/flashed
# locally with the `esp` toolchain (see rust-toolchain.toml), never in CI.
[dependencies]
evc04-cn28-core = { path = "../core" }
# esp-idf-svc's API is version-sensitive; pinned to what builds on the installed
# Xtensa Rust toolchain (older 0.49 fails the c_char signedness check on rustc ≥1.9x).
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
anyhow = "1"
# Logging plane (#3): `tracing` is the facade the whole firmware writes to; the
# records leave the box as OTLP over HTTP/protobuf. `default-features = false`
# everywhere on purpose — the OTLP defaults pull reqwest (and with it an async
# runtime), which does not belong on this target; we hand the exporter an
# esp-idf HTTP client instead.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "fmt",
    "std",
    "tracing-log",
] }
opentelemetry = { version = "0.32", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "logs",
    "http-proto",
] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
opentelemetry-http = { version = "0.32", default-features = false }
async-trait = "0.1"
http = "1"

[features]
# Publish the raw CN28 views (evc04/cn28/raw{,/hex,/ascii}) on every probe. Off by
# default: it is capture/discovery debug noise once the box auto-polls (#110). Build
# a capture image with `--features raw-debug` (e.g. `OTA_FEATURES=raw-debug ./ota_push.sh`).
raw-debug = []

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
