# cargo-make tasks for the CN28 prober firmware (evc04#66).
# Install once: `cargo install cargo-make` (bootstrap.sh does this too).
#
#   cargo make build              # native esp build (debug)
#   cargo make build -- --release # release build (args after -- go to cargo)
#   cargo make flash              # flash + monitor on the host (USB)
#   cargo make monitor            # serial monitor only, no rebuild
#   cargo make clean              # drop build artifacts (target + ESP-IDF cache)
#
# WiFi/MQTT creds are compiled in (env!); export WIFI_SSID/WIFI_PASSWORD/MQTT_URL
# before `build` for a flashable binary (placeholders otherwise). build.sh sources
# the espup env and the libxml2/ICU compat shim for you.

[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.build]
description = "Build the firmware with the native esp toolchain."
command = "./build.sh"
args = ["${@}"]

[tasks.flash]
description = "Source .env, build, then flash + monitor on the host (needs espflash + USB)."
command = "./flash.sh"
args = ["${@}"]

[tasks.monitor]
description = "Open the serial monitor without rebuilding (CTRL+R reset, CTRL+C exit)."
command = "./monitor.sh"
args = ["${@}"]

[tasks.clean]
description = "Remove build artifacts (target + ESP-IDF cache)."
command = "rm"
args = ["-rf", "target", ".embuild"]
