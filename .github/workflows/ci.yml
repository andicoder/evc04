name: CI

# Scoped to the charge daemon. core/ host tests live in core.yml; firmware/ builds
# are out of scope (the esp toolchain + device dependency keep them local-only).
on:
  push:
    branches: [main]
    paths: ['charge/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['charge/**', '.github/workflows/ci.yml']

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charge
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: charge

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  # Cross-compile both release targets on every commit so an arch- or musl-specific
  # break surfaces here, not only on a v* tag in release.yml. Build-only: no image.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charge
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
