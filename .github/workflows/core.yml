name: core

# Host tests for the pure no_std core crate (evc04-cn28-core). Built/tested on the
# stable toolchain — no esp toolchain, no device — so unlike firmware/ it runs in
# CI. Scoped to core/** with its own path filter (GitHub path filters are
# per-workflow); firmware/ has no CI — it needs the esp toolchain and a device.
on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['core/**', '.github/workflows/core.yml']

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
