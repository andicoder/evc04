name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Pinned to the original name: the repo was renamed evc04-charge -> evc04, but the
  # published image stays ghcr.io/andicoder/evc04-charge so rc.1-7, the k8s deploy
  # pin, and the README badge keep resolving. Do not switch to github.repository.
  IMAGE: ghcr.io/andicoder/evc04-charge

jobs:
  # Cross-compile a static musl binary per arch on the amd64 runner — no QEMU,
  # no compiling inside the image. cross handles the aarch64 musl toolchain.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cross

      - name: Build
        working-directory: charge
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p dist/${{ matrix.os }}/${{ matrix.arch }}
          cp charge/target/${{ matrix.target }}/release/evc04-charge \
             dist/${{ matrix.os }}/${{ matrix.arch }}/evc04-charge

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: dist/

  # Assemble per-arch scratch images and push one multi-arch manifest to GHCR.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/

      - run: chmod +x dist/linux/*/evc04-charge

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: charge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
